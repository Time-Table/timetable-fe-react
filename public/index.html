<!doctype html>
<html lang="ko">
  <head>
    <!-- charset은 문서 첫 1024바이트 안에 있어야 한다. 서드파티 스크립트보다 앞에 둔다. -->
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <!--
      description은 여기에 두지 않는다.
      정적 태그와 Helmet 태그가 둘 다 남으면 구글이 정적 쪽을 골라, 실제로 블로그 19편이
      전부 같은 설명으로 색인됐다. 페이지별 설명은 src/Seo.js가 넣는다.
      og:*는 JS를 실행하지 않는 소셜 크롤러(카카오·페이스북)가 읽어야 하므로 남긴다.
    -->
    <link rel="apple-touch-icon" href="favicon.ico" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>타임테이블 - 쉽고 빠른 모임 일정 조율 서비스</title>
    <!--
      og:site_name은 모든 경로에서 같은 값이므로 여기에만 둔다.
      Seo.js(Helmet)에 같은 태그를 또 넣으면 문서에 두 개가 남는다.
      검색결과 사이트명은 이 태그와 component/ServiceJsonLd.jsx의
      WebSite 스키마가 담당한다.
    -->
    <meta id="og-site-name" property="og:site_name" content="타임테이블" />
    <meta id="og-title" property="og:title" content="타임테이블 - 3인 이상 약속 조율" />
    <meta
      id="og-description"
      property="og:description"
      content="되는 시간만 칠하면 끝"
    />
    <meta id="og-url" property="og:url" content="https://timetable2.com/" />
    <!--
      og:image는 public/ 에 두고 고정 경로로 참조한다.
      src/assets/ 의 이미지는 빌드마다 해시가 바뀌고, 코드에서 import하지 않으면 아예 빌드되지 않는다.
    -->
    <meta id="og-image" property="og:image" content="https://timetable2.com/og-image-v2.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="타임테이블 - 3인 이상 약속 조율" />
    <meta
      name="twitter:description"
      content="되는 시간만 칠하면 끝"
    />
    <meta name="twitter:image" content="https://timetable2.com/og-image-v2.png" />
    <!--
      네이버 서치어드바이저 소유 확인. 코드는 네이버 계정마다 다르다.
      첫 줄은 2026-10 운영 계정 등록분, 둘째 줄은 2025-02 등록분(어느 계정인지 미확인이라 남겨 둔다).
    -->
    <meta name="naver-site-verification" content="5b0fee149e6a3e802a8b95da5be2ba0eea0cad9f" />
    <meta name="naver-site-verification" content="990eacb192bb46c8c1ad6ad328922c85b928a7ba" />
    <meta name="google-adsense-account" content="ca-pub-7558566935889139" />

    <!--
      서드파티는 첫 렌더를 막지 않도록 메타 뒤에 둔다.
      2026-10-09(하네스 specs/metrics.md, 사람 결정 7): GA·Clarity·애드센스 스크립트는 운영 주소(timetable2.com)에서
      관리자가 아닌 브라우저만 받는다. 로컬 개발·미리보기 확인과 관리자 사용이 분석·광고 수치에 섞이지 않게 한다.
      gtag·clarity 함수는 어디서나 만들어 두어 앱 코드가 그대로 부를 수 있다(스크립트가 없으면 쌓이기만 하고 전송되지 않는다).
      GA 자동 화면 기록은 끄고(send_page_view: false) 앱이 주소가 바뀔 때마다 표 ID를 뺀 주소로 보낸다(src/utils/analytics.js).
    -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      window.clarity =
        window.clarity ||
        function () {
          (window.clarity.q = window.clarity.q || []).push(arguments);
        };
      gtag("js", new Date());
      // 첫 설정부터 표 ID를 뺀 주소·고정 제목을 쓴다(앱이 첫 화면 기록을 보내기 전에 나가는 기록에도 원래 주소가 붙지 않게).
      // 규칙은 src/utils/analytics.js gaLocationOf와 같다: /table/<ID> → /table/:id, 검색어는 utm_*·gclid만.
      (function () {
        var anon = function (href) {
          try {
            var u = new URL(href);
            var kept = new URLSearchParams();
            u.searchParams.forEach(function (value, key) {
              if (/^(utm_[a-z_]+|gclid)$/.test(key)) kept.append(key, value.slice(0, 100));
            });
            var query = kept.toString();
            return u.origin + u.pathname.replace(/^\/table\/[^/]+/i, "/table/:id") + (query ? "?" + query : "");
          } catch (e) {
            return "";
          }
        };
        var config = { send_page_view: false, page_location: anon(window.location.href) };
        if (/^\/table\//i.test(window.location.pathname)) config.page_title = "표 화면 - 타임테이블";
        try {
          if (document.referrer && new URL(document.referrer).hostname === window.location.hostname) {
            config.page_referrer = anon(document.referrer);
          }
        } catch (e) {
          // 넘어간다
        }
        gtag("config", "G-HTPX37RLPD", config);
      })();
      (function () {
        var host = window.location.hostname;
        var production = host === "timetable2.com" || host === "www.timetable2.com";
        var admin = false;
        try {
          admin = !!window.localStorage.getItem("admin_token");
        } catch (e) {
          admin = false;
        }
        if (!production || admin) return;
        var add = function (src, attrs) {
          var el = document.createElement("script");
          el.async = true;
          el.src = src;
          for (var key in attrs || {}) el.setAttribute(key, attrs[key]);
          document.head.appendChild(el);
        };
        add("https://www.googletagmanager.com/gtag/js?id=G-HTPX37RLPD");
        add("https://www.clarity.ms/tag/vi901h4ed4");
        add("https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7558566935889139", {
          crossorigin: "anonymous",
        });
      })();
    </script>
  </head>
  <body>
    <noscript>
      <h1>타임테이블 - 효율적인 모임 시간 조율 도구</h1>
      <p>타임테이블은 복잡한 일정 조율 과정을 간소화하기 위해 만들어진 무료 서비스입니다. 10초 만에 시간 조율표를 만들고 단톡방에 링크 하나만 보내면 참여자들이 가능한 시간을 표시할 수 있습니다.</p>
      <h2>주요 서비스 안내</h2>
      <ul>
        <li><strong>빠른 테이블 생성:</strong> 모임 이름과 날짜만 선택하면 즉시 고유 링크가 생성됩니다.</li>
        <li><strong>직관적인 시간 선택:</strong> 드래그 방식으로 누구나 쉽게 가능한 시간을 입력할 수 있습니다.</li>
        <li><strong>실시간 인원 통계:</strong> 모든 구성원의 응답을 실시간으로 취합하여 보여줍니다.</li>
        <li><strong>최적의 시간 추천:</strong> 가장 많은 인원이 모일 수 있는 골든타임을 자동으로 계산합니다.</li>
      </ul>
      <p>본 서비스는 대학생 조별 과제, 직장인 회식 일정 조율, 동호회 모임 등 다양한 상황에서 최적의 시간을 찾기 위해 최적화되어 있습니다. 지금 바로 타임테이블을 이용해 보세요.</p>
    </noscript>
    <div id="root"></div>
  </body>
</html>
