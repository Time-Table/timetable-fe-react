<!doctype html>
<html lang="ko">
  <head>
    <!-- charset은 문서 첫 1024바이트 안에 있어야 한다. 서드파티 스크립트보다 앞에 둔다. -->
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <!--
      description은 여기에 두지 않는다.
      정적 태그와 Helmet 태그가 둘 다 남으면 구글이 정적 쪽을 골라, 실제로 블로그 19편이
      전부 같은 설명으로 색인됐다. 페이지별 설명은 src/Seo.js가 넣는다.
      og:*는 JS를 실행하지 않는 소셜 크롤러(카카오·페이스북)가 읽어야 하므로 남긴다.
    -->
    <link rel="apple-touch-icon" href="favicon.ico" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>타임테이블 - 쉽고 빠른 모임 일정 조율 서비스</title>
    <!--
      og:site_name은 모든 경로에서 같은 값이므로 여기에만 둔다.
      Seo.js(Helmet)에 같은 태그를 또 넣으면 문서에 두 개가 남는다.
      랜딩 <title>에서 브랜드명이 빠졌으므로, 검색결과 사이트명은 이 태그와
      component/ServiceJsonLd.jsx의 WebSite 스키마가 담당한다.
    -->
    <meta id="og-site-name" property="og:site_name" content="타임테이블" />
    <meta id="og-title" property="og:title" content="타임테이블 - 쉽고 빠른 모임 일정 조율 서비스" />
    <meta
      id="og-description"
      property="og:description"
      content="로그인 없이 30초 만에 테이블을 생성하고, 팀원들과 최적의 약속 시간을 찾아보세요. 드래그 한 번으로 가능한 시간을 공유하고 골든타임을 자동으로 계산해 드립니다."
    />
    <meta id="og-url" property="og:url" content="https://timetable2.com/" />
    <!--
      og:image는 public/ 에 두고 고정 경로로 참조한다.
      src/assets/ 의 이미지는 빌드마다 해시가 바뀌고, 코드에서 import하지 않으면 아예 빌드되지 않는다.
    -->
    <meta id="og-image" property="og:image" content="https://timetable2.com/og-image.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="타임테이블 - 쉽고 빠른 모임 일정 조율 서비스" />
    <meta
      name="twitter:description"
      content="로그인 없이 30초 만에 테이블을 생성하고, 팀원들과 최적의 약속 시간을 찾아보세요."
    />
    <meta name="twitter:image" content="https://timetable2.com/og-image.png" />
    <meta name="naver-site-verification" content="990eacb192bb46c8c1ad6ad328922c85b928a7ba" />
    <meta name="google-adsense-account" content="ca-pub-7558566935889139" />

    <!-- 서드파티는 첫 렌더를 막지 않도록 메타 뒤에 둔다. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-2K7S3S76H6"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "G-2K7S3S76H6");
    </script>
    <script type="text/javascript">
      (function (c, l, a, r, i, t, y) {
        c[a] =
          c[a] ||
          function () {
            (c[a].q = c[a].q || []).push(arguments);
          };
        t = l.createElement(r);
        t.async = 1;
        t.src = "https://www.clarity.ms/tag/" + i;
        y = l.getElementsByTagName(r)[0];
        y.parentNode.insertBefore(t, y);
      })(window, document, "clarity", "script", "vi901h4ed4");
    </script>
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7558566935889139"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <noscript>
      <h1>타임테이블 - 효율적인 모임 시간 조율 도구</h1>
      <p>타임테이블은 복잡한 일정 조율 과정을 간소화하기 위해 만들어진 무료 서비스입니다. 회원가입이나 로그인 없이 30초 만에 약속 테이블을 생성하고 공유할 수 있습니다.</p>
      <h2>주요 서비스 안내</h2>
      <ul>
        <li><strong>빠른 테이블 생성:</strong> 모임 이름과 날짜만 선택하면 즉시 고유 링크가 생성됩니다.</li>
        <li><strong>직관적인 시간 선택:</strong> 드래그 방식으로 누구나 쉽게 가능한 시간을 입력할 수 있습니다.</li>
        <li><strong>실시간 인원 통계:</strong> 모든 구성원의 응답을 실시간으로 취합하여 보여줍니다.</li>
        <li><strong>최적의 시간 추천:</strong> 가장 많은 인원이 모일 수 있는 골든타임을 자동으로 계산합니다.</li>
      </ul>
      <p>본 서비스는 대학생 조별 과제, 직장인 회식 일정 조율, 동호회 모임 등 다양한 상황에서 최적의 시간을 찾기 위해 최적화되어 있습니다. 지금 바로 타임테이블을 이용해 보세요.</p>
    </noscript>
    <div id="root"></div>
  </body>
</html>
